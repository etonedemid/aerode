# xdg-desktop-portal backends under aerode: KDE's (as with XDG_CURRENT_DESKTOP=...:KDE) or GTK's,
# and screen sharing/screenshots through xdg-desktop-portal-wlr on aerode-wm's ext-image-copy-capture
[preferred]
default=kde;gtk
org.freedesktop.impl.portal.Settings=kde;gtk;
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.Notification=plasmanotify
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
