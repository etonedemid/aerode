# aerode-picom 3
# Aerode compositor settings (picom ≥ 10): Win7-like shadows, fades and
# real blur behind every translucent (glass) surface.
# picom ≥ 12.3 runs ~/.cache/aerode/picom.conf instead, which aerode generates: it includes this file
# and adds Windows 7's window animations as window rules (src/picomconf.rs). Keep this file to
# options picom 10 and 11 understand.
backend = "glx";
vsync = true;
use-damage = true;
# fullscreen games/video bypass the compositor (no added latency, no refresh cap)
unredir-if-possible = true;
unredir-if-possible-delay = 200;
glx-no-stencil = true;

# DWM-style soft shadow around windows
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.55;
shadow-offset-x = -15;
shadow-offset-y = -12;
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dnd'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'i3lock'"
];

# quick fades like Win7 open/close (picom ≥ 12.3: only for windows without a Win7 animation)
fading = true;
fade-in-step = 0.09;
fade-out-step = 0.09;
fade-delta = 8;
# surfaces that animate themselves (aerode-wm's snap preview, Peek outlines and Alt+Tab, the tray
# flyouts and balloons) must follow their own opacity steps at once
fade-exclude = [ "_AERODE_NO_ANIM:c" ];

# Aero glass: blur whatever is behind translucent pixels
blur-method = "dual_kawase";
# Win7 DWM blurs with a sigma-3 px Gaussian (15 taps): strength 2 matches it; 4 washed the backdrop out
blur-strength = 2;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
# blur only behind aerode's own glass (frames, taskbar, Start menu, flyouts, Alt+Tab): apps that draw
# their own title bar have transparent shadow margins that would otherwise turn into a blurred halo
# (and re-blurring it on every move made dragging them lag)
blur-background-exclude = [
  "!_AERODE_GLASS@:c",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "class_g = 'i3lock'"
];

# aerode-wm shapes its own frame corners; keep picom from rounding other things
corner-radius = 0;
detect-rounded-corners = true;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
wintypes: {
  tooltip = { fade = true; shadow = true; opacity = 0.97; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { shadow = true; };
  dropdown_menu = { shadow = true; };
};
