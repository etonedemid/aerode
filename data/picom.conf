# Aero7 compositor settings: shadows, fades and real blur behind glass
backend = "glx";
vsync = true;
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "_GTK_FRAME_EXTENTS@:c" ];
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
corner-radius = 6;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "window_type = 'menu'", "window_type = 'popup_menu'", "window_type = 'tooltip'" ];
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [ "window_type = 'desktop'" ];
wintypes: { tooltip = { fade = true; shadow = true; opacity = 0.97; }; dock = { shadow = false; }; };
