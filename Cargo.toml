[package]
name = "aerode"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
cairo-rs = { version = "0.18", features = ["png"] }
pangocairo = "0.18"
zbus = "4"
async-channel = "2"
vte = "0.13"
libc = "0.2"
portable-pty = "0.8"

smithay = { version = "0.7", default-features = false, features = ["backend_winit", "backend_drm", "backend_gbm", "backend_egl", "backend_libinput", "backend_udev", "backend_session_libseat", "renderer_gl", "renderer_multi", "desktop", "wayland_frontend", "xwayland", "use_system_lib"] }
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
xcursor = "0.3"
smithay-drm-extras = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
