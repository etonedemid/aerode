[package]
name = "aero7"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = "0.18"
gdkx11 = "0.18"
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
pelite = "0.10"
anyhow = "1"
cairo-rs = { version = "0.18", features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
